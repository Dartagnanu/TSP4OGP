# Dev overrides (auto-loaded by docker compose). Speeds gtsp-server iteration:
# bind-mount source + Flask reload — no rebuild after Python edits.
services:
  app:
    volumes:
      - .:/usr/src/app
      - ./store-editor:/usr/src/app/store-editor
      - app_server_node_modules:/usr/src/app/store-editor/server/node_modules
  gtsp-server:
    volumes:
      - ./gtsp-server:/app
    environment:
      - FLASK_DEBUG=1
      - FLASK_USE_RELOADER=0
    command: ["/opt/conda/bin/python", "-u", "app.py"]
