<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Map Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="topBar">
        <button id="toggleSidebar">Toggle Sidebar</button>
        <button id="saveMapBtn">Save Map</button>
    </div>
    <!-- Sidebar -->
    <div id="sidebar" class="collapsed">
        <!-- Filled dynamically with shape templates -->
        <div id="shelfTemplates">
        </div>
    </div>

    <!-- Right-click menu -->
    <div id="contextMenu" style="display: none; position: absolute;">
      <button id="addShelfBtn">Add Shelf</button>
      <button id="deleteShelfBtn">Delete Shelf</button>
      <button id="cloneShelfBtn">Clone Shelf</button>
      <input id="newShelfName" type="text" placeholder="Shelf Name" />
    </div>
    <!-- Stage container  -->
    <div id="container"></div>
    <script src="https://cdn.jsdelivr.net/npm/konva@8/konva.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
