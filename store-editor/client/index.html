<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Map Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="topBar">
        <button id="toggleSidebar">Toggle Sidebar</button>
        <button id="testWalksBtn">Test Walks</button>
    </div>
    <!-- Sidebar -->
    <div id="sidebar" class="collapsed">
        <!-- Filled dynamically with shape templates -->
        <div id="shelfTemplates">
        </div>
    </div>

    <!-- Right-click menu -->
    <div id="contextMenu" style="display: none; position: absolute;">
        <button id="addShelfBtn">Add Shelf</button>
        <button id="deleteShelfBtn">Delete Shelf</button>
        <button id="cloneShelfBtn">Clone Shelf</button>
        <button id="editShelfBtn">Edit Shelf</button>
    </div>
    <!-- Stage container  -->
    <div id="container"></div>
    <script src="https://cdn.jsdelivr.net/npm/konva@8/konva.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/pathfinding@0.4.18/visual/lib/pathfinding-browser.min.js"></script>
    <script>
        console.log('Pathfinding library loaded:', typeof PF !== 'undefined' ? 'Yes' : 'No');
    </script>
    <script type="module" src="app.js"></script>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <canvas id="storeGrid" width="1000" height="600"></canvas>
    <div id="graph" style="width: 800px; height: 600px;"></div>
</body>
</html>
