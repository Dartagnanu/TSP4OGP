# gtsp-only debug: docker compose up mongo gtsp-server
# (avoid --build during iteration; override mounts ./gtsp-server for reload)
services:
  mongo:
    image: mongo:7
    container_name: store-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: ./store-editor
    container_name: store-app
    ports:
      - "42069:42069"
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    depends_on:
      - mongo
    volumes:
      - .:/usr/src/app
      # Keep Linux-native modules from image; avoid Windows host bcrypt breaking the container
      - app_server_node_modules:/usr/src/app/store-editor/server/node_modules

  gtsp-server:
    build: ./gtsp-server
    container_name: gtsp-server
    ports:
      - "5000:5000"   # Flask/FastAPI default port
    restart: always
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      - PATHFINDER_GPU_PROBE=0
    volumes:
      - ./gtsp-server:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - mongo

  seed:
    profiles: [seed]
    build: ./store-editor
    container_name: store-seed
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cd /usr/src/app/store-editor/server && (test -f node_modules/mongoose/package.json || npm install --omit=dev) && cd /usr/src/app && node store-editor/server/models/seed.js"
    volumes:
      - .:/usr/src/app
      - app_server_node_modules:/usr/src/app/store-editor/server/node_modules

  seed-3261:
    profiles: [seed-3261]
    build: ./store-editor
    container_name: store-seed-3261
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cd /usr/src/app/store-editor/server && (test -f node_modules/mongoose/package.json || npm install --omit=dev) && cd /usr/src/app && node store-editor/server/scripts/seedStore3261.js"
    volumes:
      - .:/usr/src/app
      - app_server_node_modules:/usr/src/app/store-editor/server/node_modules

  seed-3262:
    profiles: [seed-3262]
    build: ./store-editor
    container_name: store-seed-3262
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cd /usr/src/app/store-editor/server && (test -f node_modules/mongoose/package.json || npm install --omit=dev) && cd /usr/src/app && node store-editor/server/scripts/seedStore3262.js"
    volumes:
      - .:/usr/src/app
      - app_server_node_modules:/usr/src/app/store-editor/server/node_modules

volumes:
  mongo-data:
  app_server_node_modules: