# gtsp-only debug: docker compose up mongo gtsp-server
# Paths are relative to this repo. Do not bind-mount host source over containers.
services:
  mongo:
    image: mongo:7
    container_name: store-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: ./store-editor
    container_name: store-app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
      - PORT=3000
    depends_on:
      - mongo

  gtsp-server:
    build: ./gtsp-server
    container_name: gtsp-server
    ports:
      - "5000:5000"
    restart: always
    # Do not bind-mount ./gtsp-server:/app. Host has pathFinder.c, not
    # pathFinder.py; a mount hides the image's compiled pathFinder*.so.
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - PATHFINDER_GPU_PROBE=0
    depends_on:
      - mongo

  seed:
    profiles: [seed]
    build: ./store-editor
    container_name: store-seed
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    working_dir: /usr/src/app
    entrypoint: ["node", "server/models/seed.js"]

  seed-3260:
    profiles: [seed-3260]
    build: ./store-editor
    container_name: store-seed-3260
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    working_dir: /usr/src/app
    entrypoint: ["node", "server/scripts/seedStore3260.js"]

  seed-3261:
    profiles: [seed-3261]
    build: ./store-editor
    container_name: store-seed-3261
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    working_dir: /usr/src/app
    entrypoint: ["node", "server/scripts/seedStore3261.js"]

  seed-3262:
    profiles: [seed-3262]
    build: ./store-editor
    container_name: store-seed-3262
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/storemaps
    working_dir: /usr/src/app
    entrypoint: ["node", "server/scripts/seedStore3262.js"]

volumes:
  mongo-data:
